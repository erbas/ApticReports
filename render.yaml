services:
  - type: web
    name: apticreports
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app/main.py
    envVars:
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: APP_PASSWORD
        sync: false  # set manually in Render dashboard
      - key: SESSION_SECRET
        generateValue: true  # Render auto-generates a random secret
